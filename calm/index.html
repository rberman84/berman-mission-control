<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f6f3ee">
<link rel="apple-touch-icon" href="../apple-touch-icon.png"><title>Today</title>
<style>
:root{--bg:#f6f3ee;--ink:#2b2a28;--dim:#8a857c;--card:#fff;--sage:#6f9a86;--sageL:#e6efe9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 44px) 24px 60px}
h1{font-size:34px;font-weight:600;margin:0 0 8px;letter-spacing:-.5px}
.calm{font-size:21px;color:var(--dim);margin:0 0 44px}
h2{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin:0 0 14px}
section{margin-bottom:40px}
.c{background:var(--card);border-radius:20px;padding:20px;margin-bottom:14px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.c .tx{flex:1;min-width:0}.c b{display:block;font-weight:600}.c span{color:var(--dim);font-size:17px}
.tm{font-size:15px;color:var(--sage);font-weight:600;display:block;margin-bottom:2px}
button,a.bt{appearance:none;border:0;background:var(--sageL);color:#3f6b57;font:600 17px -apple-system,system-ui,sans-serif;padding:12px 18px;border-radius:14px;text-decoration:none;white-space:nowrap;cursor:pointer}
button:disabled{opacity:.5}.ok{color:var(--sage);font-size:16px;font-weight:600}
.empty{color:var(--dim);font-size:19px;padding:8px 2px}
#st{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 10px);left:0;right:0;text-align:center;font-size:13px;color:#b9b3a8}
#pin{display:none;margin-top:30px}#pin input{font-size:20px;padding:12px;border-radius:12px;border:1px solid #ddd;width:140px}
</style></head><body><main>
<h1 id="hi">Good morning, Rob</h1><p class="calm" id="calm">Getting your day…</p>
<section><h2>Today</h2><div id="today"></div></section>
<section><h2>Needs you</h2><div id="needs"></div></section>
<div id="pin"><input id="pinIn" inputmode="numeric" placeholder="PIN"> <button id="pinGo">Connect</button></div>
</main><div id="st"></div>
<script>
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function nyParts(d){var o={};new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d).forEach(function(p){o[p.type]=p.value;});if(o.hour==='24')o.hour='00';return o;}
function ymd(d){var p=nyParts(d);return p.year+'-'+p.month+'-'+p.day;}
function go(u){window.location.href=u;}
var CK='bermanMC.conn.v1';
var DEFURL='https://script.google.com/macros/s/AKfycbzoPFbwX5PmnWAnU20oCdxXE_JZcLrXX5KTokAuokPCukl6ju7PGKb7UdspSbLI5AwSUQ/exec';
function ckGet(){var m=/(?:^|; )mcpin=(\d+)/.exec(document.cookie);return m?m[1]:null;}
function ckSet(p){try{document.cookie='mcpin='+p+'; max-age=315360000; path=/; secure; samesite=strict';}catch(e){}}
function idbSet(p){try{var r=indexedDB.open('mc',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){r.result.transaction('kv','readwrite').objectStore('kv').put(p,'pin');};}catch(e){}}
function idbGet(cb){try{var r=indexedDB.open('mc',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){var q=r.result.transaction('kv').objectStore('kv').get('pin');q.onsuccess=function(){cb(q.result||null);};q.onerror=function(){cb(null);};};r.onerror=function(){cb(null);};}catch(e){cb(null);}}
function saveConn(c){try{localStorage.setItem(CK,JSON.stringify(c));}catch(e){}if(c&&c.pin){ckSet(c.pin);idbSet(c.pin);}}
function conn(){var c=null;try{c=JSON.parse(localStorage.getItem(CK));}catch(e){}
  if(!c||!c.pin){var p=ckGet();if(p){c={url:DEFURL,pin:p};try{localStorage.setItem(CK,JSON.stringify(c));}catch(e){}}}
  if(c&&!c.url)c.url=DEFURL;return c||null;}
(function(){var c=conn();if(c&&c.pin){ckSet(c.pin);idbSet(c.pin);}else{idbGet(function(p){if(p){saveConn({url:DEFURL,pin:p});if(typeof refresh==='function')refresh();}});}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}})();
(function(){var m=/[#&]k=(\d+)/.exec(location.hash||'');if(m){saveConn({url:DEFURL,pin:m[1]});history.replaceState(null,'',location.pathname);}})();
function api(body){var c=conn();if(!c)return Promise.reject(new Error('not connected'));body.pin=c.pin;
  var ac=window.AbortController?new AbortController():null;
  var f=fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),cache:'no-store',signal:ac?ac.signal:undefined});
  var to=new Promise(function(_,rej){setTimeout(function(){if(ac)ac.abort();rej(new Error('timed out'));},25000);});
  return Promise.race([f,to])
   .then(function(r){return r.text();}).then(function(t){var j;try{j=JSON.parse(t);}catch(e){throw new Error('script not reachable');}return j;}).then(function(j){if(!j.ok)throw new Error(j.error||'failed');return j;});}


var COPILOT='https://admin.rbermanelectric.com';
// Items that live in Copilot, not on the Ops Board (first names only)
var EXTRA=[{id:'X:jeanie',t:'Approve Jeanie’s estimate',btn:'Review',href:COPILOT}];
var S=null,FIN={};try{S=JSON.parse(localStorage.getItem('bermanMC.last.v1'));}catch(e){}
function st(x){x=String(x||'').toLowerCase();return /done/.test(x)?'done':/progress/.test(x)?'prog':'other';}
function first(t){return String(t||'').split(/[\s(,:]/)[0];}
function town(t){var m=String(t).match(/\(([^)]+)\)/);return m?m[1]:'';}
function timeOf(t){var m=String(t).match(/\b(\d{1,2}(?::\d{2})?\s*(AM|PM))\b/i);return m?m[1].toUpperCase():'';}
function what(t){var m=String(t).match(/\b(lighting|rewiring|panel|ev charger|generator|doorbell|camera|fan|outlet|solar|wiring)\b/i);return m?m[1].toLowerCase():'job';}
function jobs(){var d=ymd(new Date());return (S&&S.board||[]).filter(function(r){return /\bjob\b/i.test(r.item)&&String(r.due||'').slice(0,10)===d&&st(r.status)!=='done'&&/rob/i.test(r.owner||'');});}
function needs(){var out=[],d=ymd(new Date());if(!S)return EXTRA.slice(0,3);
  (S.approvals||[]).filter(function(a){return /pending/i.test(a.status)&&/text/i.test(a.type||'');}).forEach(function(a){
    var n=first(a.title);var when=/tomorrow|today/i.test(a.title)?' today’s':'';
    out.push({id:'A:'+a.id,aid:a.id,t:/confirm/i.test(a.type)?'Confirm'+when+' job with '+n:'Text '+n+' back',btn:'Send text',kind:'text'});});
  (S.board||[]).filter(function(r){var due=String(r.due||'').slice(0,10);return /\bjob\b/i.test(r.item)&&due&&due<d&&st(r.status)!=='done'&&/rob/i.test(r.owner||'');}).forEach(function(r){
    out.push({id:'R:'+r.row,row:r.row,item:r.item,t:'Is '+first(r.item)+'’s job finished?',btn:'Done',kind:'done'});});
  return out.concat(EXTRA).slice(0,3);}
function render(){
  var J=jobs(),N=needs(),h=+nyParts(new Date()).hour;
  $('hi').textContent=(h<12?'Good morning':h<17?'Good afternoon':'Good evening')+', Rob';
  var n=J.length+N.length,w=['Nothing','One thing','Two things','Three things','Four things','Five things','Six things'][n]||n+' things';
  $('calm').textContent=n?w+' today. You’re on track.':'A clear day. You’re on track.';
  $('today').innerHTML=J.length?J.map(function(r){var f=FIN['R:'+r.row];
    return '<div class="c"><div class="tx"><span class="tm">'+esc(timeOf(r.item))+'</span><b>'+esc(first(r.item))+'</b><span>'+esc(what(r.item+' '+r.next))+' · '+esc(town(r.item))+'</span></div>'+(f?'<span class="ok">✓ Done</span>':'<button data-row="'+r.row+'" data-a="job">Done</button>')+'</div>';}).join(''):'<div class="empty">No jobs today.</div>';
  $('needs').innerHTML=N.length?N.map(function(x,i){var f=FIN[x.id];
    return '<div class="c"><div class="tx"><b>'+esc(x.t)+'</b></div>'+(f?'<span class="ok">✓ '+esc(f)+'</span>':x.href?'<a class="bt" href="'+esc(x.href)+'">'+esc(x.btn)+'</a>':'<button data-i="'+i+'">'+esc(x.btn)+'</button>')+'</div>';}).join(''):'<div class="empty">Nothing needs you. Enjoy the day.</div>';
}
document.addEventListener('click',function(e){var b=e.target.closest('button[data-a],button[data-i]');if(!b)return;
  if(!conn()){$('pin').style.display='block';return;}
  b.disabled=true;var p;
  if(b.dataset.a==='job'){var r=jobs().filter(function(x){return String(x.row)===b.dataset.row;})[0];
    p=api({action:'done',item:r.item,row:r.row,finish:true}).then(function(){FIN['R:'+r.row]='Done';});}
  else{var x=needs()[+b.dataset.i];
    if(x.kind==='done')p=api({action:'done',item:x.item,row:x.row}).then(function(){FIN[x.id]='Done';});
    else p=api({action:'approve',id:x.aid,status:'Approved',note:''}).then(function(){return api({action:'phone',id:x.aid});}).then(function(j){FIN[x.id]='Sent to Messages';go('sms:'+String(j.phone).replace(/[^\d+]/g,'')+'&body='+encodeURIComponent(j.draft||''));});}
  p.then(function(){render();setTimeout(refresh,1500);}).catch(function(err){b.disabled=false;$('st').textContent='Didn’t save. Try again.';});
});
$('pinGo').onclick=function(){var v=$('pinIn').value.trim();if(v.length<4)return;saveConn({url:DEFURL,pin:v});$('pin').style.display='none';refresh();};
function refresh(){render();if(!conn()){$('pin').style.display='block';return;}
  var s=function(){return api({action:'state'});};
  s().catch(function(){return new Promise(function(r){setTimeout(r,2500);}).then(s);}).then(function(j){if(j&&j.board){S=j;try{localStorage.setItem('bermanMC.last.v1',JSON.stringify(j));}catch(e){}}$('st').textContent='';render();})
   .catch(function(){$('st').textContent='Showing your last update';});}
refresh();document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh();});
</script></body></html>
