<!doctype html><html lang="en"><head><meta charset="utf-8">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache">
<title>Mission Control</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#22262b;--dim:#6b6f75;--line:#e7e4dd;--g:#2f6b3a;--gs:#eaf2ea;--a:#9a5b00;--as:#fff4e0;--r:#a3352b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 20px) 16px 60px;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto}
h1{font:700 26px/1.2 Georgia,serif;margin:6px 0 2px}.sub{color:var(--dim);margin:0 0 18px;font-size:15px}
h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:24px 4px 8px;display:flex;justify-content:space-between}
h2 i{font-style:normal}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;margin-bottom:10px;transition:opacity .25s}
.c b{font-size:17px;display:block}.m{color:var(--dim);font-size:14px;margin-top:2px}
.next{background:#22262b;color:#fff;border:0}.next .m{color:#c9ccd1}.lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9fd0a8;margin-bottom:4px}
.q{background:var(--bg);border-radius:10px;padding:10px;font-size:14.5px;margin:10px 0 0;color:#33373c;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.next .q{background:#33383e;color:#e8e9eb}
.w{background:var(--as);color:var(--a);border-radius:8px;padding:6px 9px;font-size:13.5px;margin-top:8px}
.next .w{background:#3b3426;color:#f3d39b}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.bt{flex:1;min-width:92px;text-align:center;border:0;border-radius:11px;padding:12px 8px;font-size:15px;font-weight:600;background:var(--gs);color:var(--g);text-decoration:none;font-family:inherit;cursor:pointer}
.bt.s{background:#efeee9;color:#45494e;flex:0 0 auto}.next .bt{background:#fff;color:#22262b}.next .bt.s{background:#3b4047;color:#fff}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap;transition:opacity .25s}.li:first-child{border-top:0;padding-top:2px}
.li .t{flex:1;min-width:0}.li .t b{font-size:16px}.pill{font-size:12.5px;border-radius:20px;padding:3px 9px;background:#efeee9;color:var(--dim);white-space:nowrap}
.pill.old{background:#fbe9e7;color:var(--r)}.sm{border:0;border-radius:10px;padding:9px 11px;font-weight:600;font-size:14px;background:var(--gs);color:var(--g);font-family:inherit;text-decoration:none;cursor:pointer}
.sm.s{background:#efeee9;color:#45494e}
.ex{flex-basis:100%}
.gone{opacity:.3;pointer-events:none}button:disabled{opacity:.6}
.foot{text-align:center;color:var(--dim);font-size:12.5px;margin-top:26px}.foot a{color:var(--dim)}
details summary{color:var(--dim);font-size:14px;cursor:pointer;padding:8px 2px}
.empty{color:var(--dim);font-size:15px}
#pin{display:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}#pin input{font-size:20px;height:44px;padding:0 12px;border-radius:10px;border:1px solid #ddd;width:140px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#22262b;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center}
</style></head><body><main>
<div id="pin"><p style="margin:0 0 10px">Enter your PIN once to connect.</p><input id="pinIn" inputmode="numeric" autocomplete="off" placeholder="PIN"> <button class="sm" id="pinGo">Connect</button></div>
<div id="app"></div><p class="foot" id="st"></p></main><div id="toast"></div>
<script>
var BUILD='v7-20261019';
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function nyParts(d){var o={};new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d).forEach(function(p){o[p.type]=p.value;});if(o.hour==='24')o.hour='00';return o;}
function ymd(d){var p=nyParts(d);return p.year+'-'+p.month+'-'+p.day;}
var CK='bermanMC.conn.v1';
var DEFURL='https://script.google.com/macros/s/AKfycbzoPFbwX5PmnWAnU20oCdxXE_JZcLrXX5KTokAuokPCukl6ju7PGKb7UdspSbLI5AwSUQ/exec';
function ckGet(){var m=/(?:^|; )mcpin=(\d+)/.exec(document.cookie);return m?m[1]:null;}
function ckSet(p){try{document.cookie='mcpin='+p+'; max-age=315360000; path=/; secure; samesite=strict';}catch(e){}}
function idbSet(p){try{var r=indexedDB.open('mc',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){r.result.transaction('kv','readwrite').objectStore('kv').put(p,'pin');};}catch(e){}}
function idbGet(cb){try{var r=indexedDB.open('mc',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){var q=r.result.transaction('kv').objectStore('kv').get('pin');q.onsuccess=function(){cb(q.result||null);};q.onerror=function(){cb(null);};};r.onerror=function(){cb(null);};}catch(e){cb(null);}}
function saveConn(c){try{localStorage.setItem(CK,JSON.stringify(c));}catch(e){}if(c&&c.pin){ckSet(c.pin);idbSet(c.pin);}}
function conn(){var c=null;try{c=JSON.parse(localStorage.getItem(CK));}catch(e){}
  if(!c||!c.pin){var p=ckGet();if(p){c={url:DEFURL,pin:p};try{localStorage.setItem(CK,JSON.stringify(c));}catch(e){}}}
  if(c&&!c.url)c.url=DEFURL;return c||null;}
(function(){var c=conn();if(c&&c.pin){ckSet(c.pin);idbSet(c.pin);}else{idbGet(function(p){if(p){saveConn({url:DEFURL,pin:p});if(typeof refresh==='function')refresh();}});}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}})();
(function(){var m=/[#&]k=(\d+)/.exec(location.hash||'');if(m){saveConn({url:DEFURL,pin:m[1]});history.replaceState(null,'',location.pathname);}})();
function api(body){var c=conn();if(!c)return Promise.reject(new Error('not connected'));body.pin=c.pin;
  var ac=window.AbortController?new AbortController():null;
  var f=fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),cache:'no-store',signal:ac?ac.signal:undefined});
  var to=new Promise(function(_,rej){setTimeout(function(){if(ac)ac.abort();rej(new Error('timed out'));},25000);});
  return Promise.race([f,to])
   .then(function(r){return r.text();}).then(function(t){var j;try{j=JSON.parse(t);}catch(e){throw new Error('script not reachable');}return j;}).then(function(j){if(!j.ok)throw new Error(j.error||'failed');return j;});}



var COPILOT='https://admin.rbermanelectric.com',TT='https://www.thumbtack.com/pro-leads';
var LK='bermanMC.last.v6',HK='bermanMC.hide.v7';
var S=null;try{S=JSON.parse(localStorage.getItem(LK));}catch(e){}
var HIDE={};try{var h0=JSON.parse(localStorage.getItem(HK))||{};Object.keys(h0).forEach(function(k){if(Date.now()-h0[k]<14*864e5)HIDE[k]=h0[k];});}catch(e){}
function saveHide(){try{localStorage.setItem(HK,JSON.stringify(HIDE));}catch(e){}}
var EXTRA={},HIDE472={};// per-card extra content (number / nudge draft)
function toast(m){var e=$('toast');e.textContent=m;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.opacity=0;},2600);}
function copyText(s,b){var ok=false;if(b){var l0=b.textContent;setTimeout(function(){b.textContent='Copied ✓';setTimeout(function(){b.textContent=l0;},1800);},0);}
  try{var ta=document.createElement('textarea');ta.value=s;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='0';ta.style.opacity='0';ta.style.fontSize='16px';document.body.appendChild(ta);
    var r=document.createRange();r.selectNodeContents(ta);var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);ta.setSelectionRange(0,s.length);ok=document.execCommand('copy');ta.remove();sel.removeAllRanges();}catch(e){}
  if(!ok&&navigator.clipboard){navigator.clipboard.writeText(s).then(function(){toast('Copied');},function(){toast('Press and hold the text to copy');});return;}
  toast(ok?'Copied':'Press and hold the text to copy');}
function fmtPhone(p){var d=String(p).replace(/\D/g,'').slice(-10);return '('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6);}
function since(h){if(h==null)return '';if(h<1)return 'just now';if(h<24)return h+' hr'+(h===1?'':'s')+' ago';var d=Math.floor(h/24);return d+' day'+(d===1?'':'s')+' ago';}
function dayPill(d){if(d==null)return '';return '<span class="pill'+(d>=21?' old':'')+'">'+d+' day'+(d===1?'':'s')+'</span>';}
function t12(hm){var m=/^(\d{1,2}):(\d{2})/.exec(hm||'');if(!m)return '';var h=+m[1],ap=h>=12?'PM':'AM';h=h%12||12;return h+(m[2]!=='00'?':'+m[2]:'')+' '+ap;}
function dlabel(iso){var t=ymd(new Date()),tm=ymd(new Date(Date.now()+864e5));if(iso===t)return 'Today';if(iso===tm)return 'Tomorrow';
  var d=new Date(iso+'T12:00:00Z');return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getUTCDay()]+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]+' '+d.getUTCDate();}
function first(t){return String(t||'').split(/[\s(,:']/)[0];}
function town(t){var m=String(t).match(/\(([^)]+)\)/);return m?m[1]:'';}
var ACT={},AID=0;function act(fn){var k='a'+(++AID);ACT[k]=fn;return k;}
function btn(cls,label,fn){return '<button class="'+cls+'" data-a="'+act(fn)+'">'+esc(label)+'</button>';}
function link(cls,label,href){return '<a class="'+cls+' out" href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(label)+' ↗</a>';}
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var f=ACT[b.getAttribute('data-a')];if(f){e.preventDefault();f(b);}});
function hide(id,msg){HIDE[id]=Date.now();saveHide();if(msg)toast(msg);render();}
function unhide(id,msg){delete HIDE[id];saveHide();toast(msg);render();}

// ---------- build the model (v6 shape, with fallback to the old shape) ----------
function model(){var M={leads:[],jobs:[],uninv:[],drafts:[],waiting:[],never:[],v6:!!(S&&S.copilot)};if(!S)return M;var C=S.copilot,today=ymd(new Date());
  var rec={};if(C)(C.recent||[]).concat(C.newLeads||[]).forEach(function(l){if(!rec[l.first])rec[l.first]=l;});
  (S.approvals||[]).filter(function(a){return /pending/i.test(a.status)&&/new lead|reply|text|follow/i.test(a.type||'');}).forEach(function(a){
    var f=first(a.title),l=rec[f]||{},h=l.hours;if(h==null&&a.created){var t=Date.parse(String(a.created).replace(' ','T')+':00-04:00');if(isFinite(t))h=Math.round((Date.now()-t)/36e5);}
    var svc=(String(a.title).split(':')[1]||'').replace(/\(.*?\)/,'').trim();
    M.leads.push({id:'A:'+a.id,aid:a.id,first:f,svc:l.service||svc,town:l.town||town(a.title),hours:h,is472:!!(a.is472||l.is472||HIDE472['A:'+a.id]),draft:a.draft,lead_id:l.lead_id,type:a.type});});
  if(C){(C.newLeads||[]).forEach(function(l){if(M.leads.some(function(x){return x.first===l.first;}))return;
      M.leads.push({id:'L:'+l.lead_id,first:l.first,svc:l.service,town:l.town,hours:l.hours,is472:l.is472,lead_id:l.lead_id,nodraft:true});});
    (C.jobs||[]).forEach(function(j){if(j.date>=today)M.jobs.push({id:'J:'+j.date+j.first,first:j.first,svc:j.service,town:j.town,date:j.date,start:j.start,end:j.end,est:j.estimate_id,visit:j.visit,approved:j.approved});});
    (C.uninvoiced||[]).forEach(function(u){M.uninv.push({id:'U:'+u.first,first:u.first,town:u.town,svc:u.service,days:u.days,inv:u.invoice,lead_id:u.lead_id});});
    (C.drafts||[]).forEach(function(d){M.drafts.push({id:'D:'+d.estimate_id,first:d.first,svc:d.service,days:d.days,est:d.estimate_id});});
    (C.waiting||[]).forEach(function(l){M.waiting.push({id:'W:'+l.lead_id,first:l.first,svc:l.service,town:l.town,days:l.days,lead_id:l.lead_id,is472:l.is472,followed:l.followed});});
    (C.neverBooked||[]).forEach(function(l){if(M.leads.some(function(x){return x.first===l.first;}))return;M.never.push({id:'N:'+l.lead_id,first:l.first,svc:l.service,town:l.town,days:l.days,lead_id:l.lead_id,is472:l.is472,followed:l.followed});});
  } else {// old script: board only
    var invd={};(S.board||[]).forEach(function(r){var m=/^(?:Invoiced|Followed up): ([A-Za-z\-']+)/.exec(String(r.item));if(m)invd[m[1]]=1;});
    (S.board||[]).forEach(function(r){var it=String(r.item),due=String(r.due||'').slice(0,10),done=/done|cancel/i.test(r.status);
      var jm=/^([A-Z][a-z]+)\s+(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\w*\s+job,?\s*([^()]*)\(?([^)]*)\)?/.exec(it);
      if(jm&&!done&&due>=today)M.jobs.push({id:'J:'+r.row,row:r.row,item:r.item,first:jm[1],town:jm[3],date:due,timeTxt:jm[2].trim(),svc:''});
      if(jm&&done&&!invd[jm[1]]&&due&&due<today&&(Date.now()-Date.parse(due))<14*864e5)M.uninv.push({id:'U:'+jm[1],first:jm[1],town:jm[3],days:Math.floor((Date.now()-Date.parse(due))/864e5)});
      var em=/^([A-Z][a-z]+): review estimate/.exec(it);if(em&&/wait/i.test(r.status))M.drafts.push({id:'D:'+r.row,first:em[1],svc:''});});}
  M.jobs.sort(function(a,b){return (a.date+(a.start||''))<(b.date+(b.start||''))?-1:1;});
  M.leads.sort(function(a,b){return (b.hours||0)-(a.hours||0);});
  ['leads','jobs','uninv','drafts','waiting','never'].forEach(function(k){M[k]=M[k].filter(function(x){return !HIDE[x.id];});});
  return M;}

// ---------- actions ----------
function busyBtn(b,t){if(b){b.dataset.l=b.dataset.l||b.textContent;b.textContent=t||'…';b.disabled=true;}}
function freeBtn(b){if(b&&b.dataset.l){b.textContent=b.dataset.l;b.disabled=false;}}
function save(x,label,req,fallback){hide(x.id,'Saving…');
  api(req).catch(function(e){if(fallback&&/unknown action/.test(e.message))return api(fallback);throw e;})
   .then(function(){toast(label+' ✓ Saved');},function(){unhide(x.id,'Couldn’t save that. It’s back on your list. Try again.');});}
function doSent(x){save(x,'Marked sent',x.aid?{action:'sent',id:x.aid}:{action:'sent',lead_id:x.lead_id,first:x.first},x.aid?{action:'approve',id:x.aid,status:'Approved',note:'Sent by Rob (Mission Control)'}:null);}
function doLost(x){if(!confirm('Close out '+x.first+'? This only hides it here. Nobody gets contacted, and Copilot isn’t changed.'))return;
  save(x,'Closed out',{action:'marklost',lead_id:x.lead_id,estimate_id:x.est,first:x.first});}
function doInvoiced(x){save(x,'Marked invoiced',{action:'sent',lead_id:'inv-'+x.first,first:x.first});}
function doNudge(x,kind,b){busyBtn(b,'Loading…');api({action:'nudge',lead_id:x.lead_id,kind:kind}).then(function(j){EXTRA[x.id]={draft:j.draft,phone:j.phone,is472:j.is472};render();})
  .catch(function(e){freeBtn(b);toast(/unknown action/.test(e.message)?'Nudge needs the script update.':'Couldn’t load a draft just now. Try again.');});}
function doNumber(x,b){busyBtn(b,'Loading…');api({action:'phone',id:x.aid}).then(function(j){if(/^\+?1?472/.test(String(j.phone).replace(/[^\d+]/g,''))){x.is472=true;HIDE472[x.id]=1;toast('That’s a Thumbtack 472 number. Reply in Thumbtack.');render();return;}EXTRA[x.id]=Object.assign(EXTRA[x.id]||{},{phone:j.phone});render();})
  .catch(function(e){freeBtn(b);toast(/no number/.test(e.message)?'No number on file. Use Thumbtack.':'Couldn’t get the number just now. Try again.');});}
// Address: shown INSIDE the page (with Copy + Maps ↗), so tapping never leaves Mission Control.
function doAddr(x,b){busyBtn(b,'Loading…');var p=x.est?api({action:'jobaddr',estimate_id:x.est}):x.row?api({action:'address',row:x.row,item:x.item}):Promise.reject(new Error('none'));
  p.then(function(j){EXTRA[x.id]={addr:j.address};render();})
   .catch(function(){EXTRA[x.id]={addr:(x.town?x.town+', NY':''),townOnly:true};render();});}

// ---------- render ----------
function addrHtml(x){var e=EXTRA[x.id];if(!e||e.addr==null)return '';if(!e.addr)return '<div class="w">No address on file. Check Copilot.</div>';
  return '<div class="q">'+esc(e.addr)+'</div>'+(e.townOnly?'<div class="w">No street address on file, so this is just the town.</div>':'')+'<div class="row">'+btn('bt s','Copy address',function(b){copyText(e.addr,b);})+link('bt','Maps','https://maps.apple.com/?daddr='+encodeURIComponent(e.addr))+'</div>';}
function extraHtml(x){var e=EXTRA[x.id];if(!e||e.addr!=null)return '';var o='<div class="ex">';
  if(e.draft)o+='<div class="q">'+esc(e.draft)+'</div><div class="row">'+btn('bt','Copy text',function(b){copyText(e.draft,b);})+(e.is472||!e.phone?link('bt','Thumbtack',TT):'')+'</div>';
  if(e.phone)o+='<div class="row" style="align-items:center"><span style="flex:1;font-weight:600">Text to '+esc(fmtPhone(e.phone))+'</span>'+btn('sm s','Copy number',function(b){copyText(fmtPhone(e.phone),b);})+'</div>';
  else if(e.is472)o+='<div class="w">472 is a Thumbtack relay number, so reply in Thumbtack.</div>';
  return o+'</div>';}
function leadCard(x,isNext){var meta=[isNext?x.svc:'',x.town,x.hours!=null?'came in '+since(x.hours):''].filter(Boolean).join(' · ');
  var o='<div class="c'+(isNext?' next':'')+'">'+(isNext?'<div class="lab">Do this next</div>':'')+'<b>'+(isNext?'Answer '+esc(x.first)+(x.is472?' on Thumbtack':''):esc(x.first)+(x.svc?' · '+esc(x.svc):''))+'</b><div class="m">'+esc(meta)+'</div>';
  if(x.is472)o+='<div class="w">472 number: it’s a Thumbtack relay. Reply in Thumbtack, not by text.</div>';
  if(x.draft){o+='<div class="q">'+esc(x.draft)+'</div><div class="row">'+btn('bt','Copy text',function(b){copyText(x.draft,b);})+(x.is472?link('bt','Thumbtack',TT):btn('bt','Show number',function(b){doNumber(x,b);}))+btn('bt s','Sent ✓',function(){doSent(x);})+'</div>';
    var e=EXTRA[x.id];if(e&&e.phone)o+='<div class="row" style="align-items:center"><span style="flex:1;font-weight:600">Text to '+esc(fmtPhone(e.phone))+'</span>'+btn('sm s','Copy number',function(b){copyText(fmtPhone(e.phone),b);})+'</div>';}
  else o+='<div class="m" style="margin-top:6px">No draft yet. Head Honcho will add one.</div><div class="row">'+link('bt','Thumbtack',TT)+link('bt s','Copilot',COPILOT)+'</div>';
  return o+'</div>';}
function sec(title,n,body){return '<h2>'+esc(title)+(n!=null?'<i>'+n+'</i>':'')+'</h2>'+body;}
function render(){ACT={};var M=model(),o='',today=ymd(new Date());
  var tj=M.jobs.filter(function(j){return j.date===today;});
  var parts=[];if(tj.length)parts.push(tj.length+' job'+(tj.length>1?'s':'')+' today');if(M.leads.length)parts.push(M.leads.length+' lead'+(M.leads.length>1?'s':'')+' to answer');
  if(M.uninv.length)parts.push(M.uninv.length+' to invoice');if(M.drafts.length)parts.push(M.drafts.length+' estimate'+(M.drafts.length>1?'s':'')+' to finish');
  var hr=+nyParts(new Date()).hour,greet=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  var nothing=S&&!parts.length&&!M.waiting.length&&!M.never.length;
  o+='<h1>'+greet+', Rob</h1><p class="sub">'+esc(dlabel(today))+' · '+(S?(nothing?'Nothing open. You’re all caught up.':parts.join(' · ')||'Follow-ups below'):'Loading…')+'</p>';
  // Do this next
  var nx=null;if(M.leads.length)nx={k:'lead',x:M.leads[0]};else if(tj.length)nx={k:'job',x:tj[0]};else if(M.uninv.length)nx={k:'inv',x:M.uninv[0]};else if(M.drafts.length)nx={k:'draft',x:M.drafts[0]};
  if(nx&&nx.k==='lead')o+=leadCard(nx.x,true);
  else if(nx&&nx.k==='inv')o+='<div class="c next"><div class="lab">Do this next</div><b>Invoice '+esc(nx.x.first)+'</b><div class="m">'+esc([nx.x.town,nx.x.days!=null?'job was '+nx.x.days+' days ago':''].filter(Boolean).join(' · '))+'</div><div class="row">'+link('bt','Copilot',COPILOT)+btn('bt s','Invoiced ✓',function(){doInvoiced(nx.x);})+'</div></div>';
  else if(nx&&nx.k==='draft')o+='<div class="c next"><div class="lab">Do this next</div><b>Finish '+esc(nx.x.first)+'’s estimate</b><div class="m">'+esc(nx.x.svc||'')+'</div><div class="row">'+link('bt','Copilot',COPILOT)+'</div></div>';
  // Leads
  var rest=M.leads.slice(nx&&nx.k==='lead'?1:0);
  if(rest.length)o+=sec('New leads waiting',M.leads.length,rest.map(function(x){return leadCard(x,false);}).join(''));
  // Jobs
  if(M.jobs.length||M.v6){var j=M.jobs[0];
    o+=sec(tj.length?'Today':'Next job',null,j?'<div class="c"><b>'+esc(j.first)+(j.svc?' · '+esc(j.svc):'')+(j.visit?' (estimate visit)':'')+'</b><div class="m">'+esc([dlabel(j.date),j.start?t12(j.start)+(j.end?'–'+t12(j.end):''):(j.timeTxt||''),j.town,j.approved?'estimate approved':''].filter(Boolean).join(' · '))+'</div><div class="row">'+btn('bt','Address',function(b){doAddr(j,b);})+link('bt s','Copilot',COPILOT)+'</div>'+addrHtml(j)+
      (M.jobs.length>1?'<div class="m" style="margin-top:8px">Then: '+esc(M.jobs.slice(1,4).map(function(y){return y.first+' '+dlabel(y.date);}).join(', '))+'</div>':'<div class="m" style="margin-top:8px">Nothing else booked in the next 2 weeks.</div>')+'</div>':'<div class="c empty">Nothing booked in the next 2 weeks.</div>');}
  // Uninvoiced
  if(M.uninv.length)o+=sec('Done, not invoiced',M.uninv.length,'<div class="c">'+M.uninv.map(function(x){return '<div class="li"><div class="t"><b>'+esc(x.first)+'</b><div class="m">'+esc([x.svc,x.town,x.inv==='draft'?'invoice drafted':''].filter(Boolean).join(' · '))+'</div></div>'+dayPill(x.days)+link('sm','Copilot',COPILOT)+btn('sm s','Invoiced ✓',function(){doInvoiced(x);})+'</div>';}).join('')+'</div>');
  // Drafts
  if(M.drafts.length)o+=sec('Estimates to finish',M.drafts.length,'<div class="c">'+M.drafts.map(function(x){return '<div class="li"><div class="t"><b>'+esc(x.first)+'</b><div class="m">'+esc(x.svc||'')+'</div></div>'+dayPill(x.days)+link('sm','Copilot',COPILOT)+'</div>';}).join('')+'</div>');
  // Waiting + never booked
  function fl(x,kind){return '<div class="li"><div class="t"><b>'+esc(x.first)+'</b><div class="m">'+esc([x.svc,x.town,x.is472?'472':'' ,x.followed?'nudged':''].filter(Boolean).join(' · '))+'</div></div>'+dayPill(x.days)+
    (x.is472?link('sm','Thumbtack',TT):btn('sm','Nudge',function(b){doNudge(x,kind,b);}))+btn('sm s',x.days>=(kind==='lead'?14:21)?'Close':'Sent ✓',function(){x.days>=(kind==='lead'?14:21)?doLost(x):doSent(x);})+extraHtml(x)+'</div>';}
  function fold(list,kind){var lim=kind==='lead'?14:21,a=list.filter(function(x){return x.days<lim;}),b=list.filter(function(x){return x.days>=lim;});
    return '<div class="c">'+(a.map(function(x){return fl(x,kind);}).join('')||'<div class="empty">Nothing recent.</div>')+(b.length?'<details><summary>'+b.length+' older than '+(lim===14?'2':'3')+' weeks: close out?</summary>'+b.map(function(x){return fl(x,kind);}).join('')+'</details>':'')+'</div>';}
  if(M.waiting.length)o+=sec('Waiting on customer',M.waiting.length,fold(M.waiting,'estimate'));
  if(M.never.length)o+=sec('Never booked',M.never.length,fold(M.never,'lead'));
  if(S&&!M.v6)o+='<div class="c m">Copilot isn’t connecting to Mission Control right now, so follow-ups and nudges are hidden. Leads, jobs and invoices below come from your board.</div>';
  $('app').innerHTML=o;}

function stamp(){if(!S)return '';var a=S.copilot&&S.copilot.at?new Date(S.copilot.at):null;var tf=function(d){return d.toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'});};
  return (a?'Copilot '+tf(a)+' ET · ':'')+'Board '+esc(String(S.at||'').slice(11))+' ET';}
var busy=false;
function refresh(){render();if(!conn()){$('pin').style.display='block';return Promise.resolve();}
  if(busy)return Promise.resolve();busy=true;
  var s=function(){return api({action:'state'});};
  return s().catch(function(e){if(/pin/i.test(e.message))throw e;return new Promise(function(r){setTimeout(r,2500);}).then(s);}).then(function(j){if(!j||!j.board)throw new Error('bad state');S=j;try{localStorage.setItem(LK,JSON.stringify(j));}catch(e){}
      $('st').innerHTML=stamp()+' · <a href="classic/" target="_blank" rel="noopener">Classic view ↗</a>';})
   .catch(function(e){$('st').innerHTML=(S?'Showing your last update · ':'Can’t reach your board right now · ')+'<a href="classic/" target="_blank" rel="noopener">Classic view ↗</a>';if(/pin/i.test(e.message))$('pin').style.display='block';})
   .then(function(){busy=false;render();});}
$('pinGo').onclick=function(){var v=$('pinIn').value.trim();if(v.length<4)return;saveConn({url:DEFURL,pin:v});$('pin').style.display='none';refresh();};
function verCheck(){if(!/^https?:/.test(location.protocol))return;fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(v){
  if(v&&v.build&&v.build!==BUILD){var k='bermanMC.reload';if(sessionStorage.getItem(k)===v.build)return;sessionStorage.setItem(k,v.build);location.reload();}}).catch(function(){});}
refresh();verCheck();
document.addEventListener('visibilitychange',function(){if(!document.hidden){refresh();verCheck();}});
window.addEventListener('pageshow',function(e){if(e.persisted){busy=false;refresh();verCheck();}});
setInterval(function(){if(!document.hidden)refresh();},300000);
</script></body></html>
