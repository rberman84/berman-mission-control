<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Mission">
<meta name="theme-color" content="#f6f3ee"><meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache">
<title>Mission Control</title>
<style>
:root{--bg:#f6f3ee;--ink:#2b2a28;--dim:#8a857c;--faint:#b9b3a8;--card:#fff;--sage:#6f9a86;--sageL:#e6efe9;--sageD:#3f6b57}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 44px) 24px calc(env(safe-area-inset-bottom) + 90px)}
h1{font-size:34px;font-weight:600;margin:0 0 8px;letter-spacing:-.5px}
.calm{font-size:21px;color:var(--dim);margin:0 0 44px;transition:opacity .3s}
h2{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin:0 0 14px}
section{margin-bottom:40px}
.c{background:var(--card);border-radius:20px;padding:20px;margin-bottom:14px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);
  overflow:hidden;transition:opacity .45s ease,transform .45s ease,max-height .45s ease .25s,margin .45s ease .25s,padding .45s ease .25s;max-height:220px}
.c.gone{opacity:0;transform:translateY(8px) scale(.98);max-height:0;margin-bottom:0;padding-top:0;padding-bottom:0}
.c .tx{flex:1;min-width:0}.c b{display:block;font-weight:600}.c span.s{color:var(--dim);font-size:17px}
.tm{font-size:15px;color:var(--sage);font-weight:600;display:block;margin-bottom:2px}
button,a.bt{appearance:none;border:0;background:var(--sageL);color:var(--sageD);font:600 17px -apple-system,system-ui,sans-serif;padding:12px 18px;border-radius:14px;text-decoration:none;white-space:nowrap;cursor:pointer;min-width:84px;text-align:center;transition:background .25s,color .25s}
button:active,a.bt:active{transform:scale(.97)}
button.chk{background:var(--sage);color:#fff}
.ck{display:inline-block;width:22px;height:22px;vertical-align:-5px}
.ck path{stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;animation:dr .4s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.empty{color:var(--dim);font-size:19px;padding:8px 2px}
.more{background:none;color:var(--dim);font-weight:500;font-size:16px;padding:6px 2px;min-width:0}
.note{color:var(--dim);font-size:15px;margin:-6px 4px 14px}
#doneSec{display:none}#doneSec h2{color:var(--faint)}
.dl{color:var(--faint);font-size:17px;padding:6px 2px;text-decoration:line-through;text-decoration-color:#d6d0c6;animation:fi .5s ease}
.dl:before{content:"✓  ";color:var(--sage);text-decoration:none;display:inline-block;margin-right:4px}
@keyframes fi{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,30px);opacity:0;background:#3a3936;color:#f6f3ee;padding:12px 16px 12px 20px;border-radius:16px;font-size:16px;display:flex;gap:14px;align-items:center;transition:all .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;color:#cfe5da;padding:4px 6px;min-width:0;font-size:16px}
#st{text-align:center;font-size:13px;color:var(--faint);margin-top:30px}#st a{color:var(--faint)}
#pin{display:none;margin:0 0 30px}#pin p{color:var(--dim);margin:0 0 10px}#pin input{font-size:20px;padding:12px;border-radius:12px;border:1px solid #ddd;width:140px;background:#fff}
</style></head><body><main>
<h1 id="hi">Hello, Rob</h1><p class="calm" id="calm">Getting your day…</p>
<div id="pin"><p>Enter your PIN once to connect.</p><input id="pinIn" inputmode="numeric" autocomplete="off" placeholder="PIN"> <button id="pinGo">Connect</button></div>
<section><h2>Today</h2><div id="today"></div></section>
<section><h2>Needs you</h2><div id="needs"></div></section>
<section id="doneSec"><h2>Done today</h2><div id="done"></div></section>
<div id="st"></div>
</main><div id="toast"><span id="tmsg"></span><button id="undo">Undo</button></div>
<script>
var BUILD='2026-10-16b';
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function nyParts(d){var o={};new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d).forEach(function(p){o[p.type]=p.value;});if(o.hour==='24')o.hour='00';return o;}
function ymd(d){var p=nyParts(d);return p.year+'-'+p.month+'-'+p.day;}
function go(u){window.location.href=u;}
var CK='bermanMC.conn.v1';
var DEFURL='https://script.google.com/macros/s/AKfycbzoPFbwX5PmnWAnU20oCdxXE_JZcLrXX5KTokAuokPCukl6ju7PGKb7UdspSbLI5AwSUQ/exec';
function ckGet(){var m=/(?:^|; )mcpin=(\d+)/.exec(document.cookie);return m?m[1]:null;}
function ckSet(p){try{document.cookie='mcpin='+p+'; max-age=315360000; path=/; secure; samesite=strict';}catch(e){}}
function idbSet(p){try{var r=indexedDB.open('mc',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){r.result.transaction('kv','readwrite').objectStore('kv').put(p,'pin');};}catch(e){}}
function idbGet(cb){try{var r=indexedDB.open('mc',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){var q=r.result.transaction('kv').objectStore('kv').get('pin');q.onsuccess=function(){cb(q.result||null);};q.onerror=function(){cb(null);};};r.onerror=function(){cb(null);};}catch(e){cb(null);}}
function saveConn(c){try{localStorage.setItem(CK,JSON.stringify(c));}catch(e){}if(c&&c.pin){ckSet(c.pin);idbSet(c.pin);}}
function conn(){var c=null;try{c=JSON.parse(localStorage.getItem(CK));}catch(e){}
  if(!c||!c.pin){var p=ckGet();if(p){c={url:DEFURL,pin:p};try{localStorage.setItem(CK,JSON.stringify(c));}catch(e){}}}
  if(c&&!c.url)c.url=DEFURL;return c||null;}
(function(){var c=conn();if(c&&c.pin){ckSet(c.pin);idbSet(c.pin);}else{idbGet(function(p){if(p){saveConn({url:DEFURL,pin:p});if(typeof refresh==='function')refresh();}});}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}})();
(function(){var m=/[#&]k=(\d+)/.exec(location.hash||'');if(m){saveConn({url:DEFURL,pin:m[1]});history.replaceState(null,'',location.pathname);}})();
function api(body){var c=conn();if(!c)return Promise.reject(new Error('not connected'));body.pin=c.pin;
  var ac=window.AbortController?new AbortController():null;
  var f=fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),cache:'no-store',signal:ac?ac.signal:undefined});
  var to=new Promise(function(_,rej){setTimeout(function(){if(ac)ac.abort();rej(new Error('timed out'));},25000);});
  return Promise.race([f,to])
   .then(function(r){return r.text();}).then(function(t){var j;try{j=JSON.parse(t);}catch(e){throw new Error('script not reachable');}return j;}).then(function(j){if(!j.ok)throw new Error(j.error||'failed');return j;});}


var COPILOT='https://admin.rbermanelectric.com';
var LK='bermanMC.last.v1',DK='bermanMC.done.v1';
var S=null;try{S=JSON.parse(localStorage.getItem(LK));}catch(e){}
// Done today (kept on this phone for the day) + items hidden while their save is pending/just finished
var D={day:ymd(new Date()),list:[]};try{var d0=JSON.parse(localStorage.getItem(DK));if(d0&&d0.day===D.day)D=d0;}catch(e){}
function saveD(){try{localStorage.setItem(DK,JSON.stringify(D));}catch(e){}}
var HIDE={},NOTE={},showAll=false,started=0;
D.list.forEach(function(x){HIDE[x.id]=1;});

function st(x){x=String(x||'').toLowerCase();return /done|cancel/.test(x)?'done':/wait/.test(x)?'wait':/progress/.test(x)?'prog':'other';}
function first(t){return String(t||'').split(/[\s(,:']/)[0];}
function town(t){var m=String(t).match(/\(([^)]+)\)/);return m?m[1]:'';}
function timeOf(t){var m=String(t).match(/\b(\d{1,2}(?::\d{2})?\s*(AM|PM))\b/i);return m?m[1].toUpperCase():'Time TBD';}
function what(t){var m=String(t).match(/\b(lighting|rewiring|panel|ev charger|generator|doorbell|camera|fan|outlet|solar|wiring|estimate)\b/i);return m?m[1].toLowerCase():'job';}
var DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function dayWord(iso){if(!iso)return '';var t=ymd(new Date()),tm=ymd(new Date(Date.now()+864e5));if(iso===t)return 'today’s';if(iso===tm)return 'tomorrow’s';
  return DOW[new Date(iso+'T12:00:00Z').getUTCDay()]+'’s';}
function apprDate(a){var m=String(a.title).match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+(\d{1,2})\b/i),y=nyParts(new Date()).year;
  if(m)return y+'-'+String(MON[m[1].toLowerCase()]).padStart(2,'0')+'-'+String(m[2]).padStart(2,'0');
  var c=String(a.created||'').slice(0,10);if(/tomorrow/i.test(a.title)&&c){var d=new Date(c+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10);}
  if(/today/i.test(a.title))return c;return '';}
function isJob(r){return /\b(job|visit|walkthrough|appointment)\b/i.test(r.item)&&!/^schedule /i.test(r.item)&&/rob/i.test(r.owner||'')&&st(r.status)!=='done';}
function jobs(){var d=ymd(new Date());return (S&&S.board||[]).filter(function(r){return isJob(r)&&String(r.due||'').slice(0,10)===d;})
  .map(function(r){return {id:'J:'+r.row,row:r.row,item:r.item,next:r.next,label:first(r.item)+'’s '+what(r.item+' '+r.next),kind:'job'};})
  .sort(function(a,b){return mins(a.item)-mins(b.item);});}
function mins(t){var m=String(t).match(/\b(\d{1,2})(?::(\d{2}))?\s*(AM|PM)\b/i);return m?(+m[1]%12+(/pm/i.test(m[3])?12:0))*60+ +(m[2]||0):9999;}
function needs(){var out=[],d=ymd(new Date());if(!S)return out;
  (S.approvals||[]).filter(function(a){return /pending/i.test(a.status);}).forEach(function(a){var n=first(a.title),ty=String(a.type||''),t,btn='Send text';
    if(/confirm/i.test(ty)){var w=dayWord(apprDate(a));t='Confirm '+(w?w+' ':'')+'job with '+n;}
    else if(/new lead/i.test(ty))t='Reply to '+n+', a new customer';
    else if(/follow/i.test(ty))t='Check in with '+n+' about the estimate';
    else if(/review request/i.test(ty)){t='Ask '+(/past customers/i.test(a.title)?'past customers':n)+' for a review';btn='Approve';}
    else if(/text/i.test(ty))t='Text '+n;
    else{t=String(a.title).replace(/\s*\(.*?\)/g,'');btn='Approve';}
    out.push({id:'A:'+a.id,aid:a.id,t:t,label:t.replace(/^Confirm/,'Confirmed').replace(/^Reply to (\w+).*/,'Replied to $1').replace(/^Check in/,'Checked in').replace(/^Text/,'Texted').replace(/^Ask/,'Asked'),btn:btn,kind:btn==='Send text'?'text':'appr'});});
  (S.board||[]).forEach(function(r){var due=String(r.due||'').slice(0,10);
    if(isJob(r)&&due&&due<d)out.push({id:'R:'+r.row,row:r.row,item:r.item,t:'Is '+first(r.item)+'’s job finished?',label:first(r.item)+'’s job',btn:'Done',kind:'done'});});
  (S.board||[]).filter(function(r){return st(r.status)==='wait'&&/rob/i.test(r.owner||'');}).forEach(function(r){
    if(/estimate/i.test(r.area||'')||/estimate/i.test(r.item))out.push({id:'R:'+r.row,t:'Review '+first(r.item)+'’s estimate',btn:'Review',href:COPILOT,kind:'link'});
    else out.push({id:'R:'+r.row,row:r.row,item:r.item,t:String(r.item).replace(/\s*\(.*?\)/g,''),label:String(r.item).replace(/\s*\(.*?\)/g,''),btn:'Done',kind:'done'});});
  return out;}
var CK_SVG='<svg class="ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function card(x){return '<div class="c" data-id="'+esc(x.id)+'">'+x.body+(x.href?'<a class="bt" href="'+esc(x.href)+'">'+esc(x.btn)+'</a>':'<button data-id="'+esc(x.id)+'">'+esc(x.btn)+'</button>')+'</div>'+(NOTE[x.id]?'<div class="note">'+esc(NOTE[x.id])+'</div>':'');}
var CUR={};
function render(){
  var h=+nyParts(new Date()).hour;$('hi').textContent=(h<5?'Hello':h<12?'Good morning':h<17?'Good afternoon':'Good evening')+', Rob';
  var J=jobs().filter(function(x){return !HIDE[x.id];}),N=needs().filter(function(x){return !HIDE[x.id];});CUR={};
  J.concat(N).forEach(function(x){CUR[x.id]=x;});
  var n=J.length+N.length,did=D.list.length,W=['Nothing','One thing','Two things','Three things','Four things','Five things','Six things','Seven things'];
  $('calm').textContent=!S?'Getting your day…':n===0?(did?'All done. Enjoy the day.':'Nothing needs you. Enjoy the day.'):did?(n===1?'One left. Nice.':n+' left. Nice pace.'):(W[n]||n+' things')+' today. You’re on track.';
  $('today').innerHTML=J.length?J.map(function(x){x.body='<div class="tx"><span class="tm">'+esc(timeOf(x.item))+'</span><b>'+esc(first(x.item))+'</b><span class="s">'+esc(what(x.item+' '+x.next))+(town(x.item)?' · '+esc(town(x.item)):'')+'</span></div>';x.btn='Done';return card(x);}).join(''):'<div class="empty">No jobs today.</div>';
  var top=showAll?N:N.slice(0,3);
  $('needs').innerHTML=N.length?top.map(function(x){x.body='<div class="tx"><b>'+esc(x.t)+'</b></div>';return card(x);}).join('')+(N.length>3&&!showAll?'<button class="more" id="more">and '+(N.length-3)+' more</button>':''):'<div class="empty">Nothing needs you. Enjoy the day.</div>';
  $('doneSec').style.display=did?'block':'none';$('done').innerHTML=D.list.map(function(x){return '<div class="dl">'+esc(x.label)+'</div>';}).join('');
}
// ---- Done flow: check, slide away, land in Done today; save after a 5s undo window ----
var PEND=null;
function toast(msg,undo){$('tmsg').textContent=msg;$('undo').style.display=undo?'':'none';$('toast').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){$('toast').classList.remove('on');},undo?5000:3200);}
function finish(x,btn,run,delay){
  btn.disabled=true;btn.classList.add('chk');btn.innerHTML=CK_SVG;delete NOTE[x.id];
  var el=btn.closest('.c');setTimeout(function(){el.classList.add('gone');},550);
  setTimeout(function(){HIDE[x.id]=1;D.list.push({id:x.id,label:x.label||x.t});saveD();render();},1250);
  var save=function(){run().then(function(){setTimeout(refresh,1500);}).catch(function(err){
      delete HIDE[x.id];D.list=D.list.filter(function(y){return y.id!==x.id;});saveD();NOTE[x.id]='Couldn’t save that one. It’s back on your list.';render();});};
  if(!delay){save();return;}
  if(PEND)PEND.fire();
  var tm=setTimeout(function(){PEND=null;save();},5000);
  PEND={fire:function(){clearTimeout(tm);PEND=null;save();},undo:function(){clearTimeout(tm);PEND=null;delete HIDE[x.id];D.list=D.list.filter(function(y){return y.id!==x.id;});saveD();render();}};
  toast('Done. Nice work.',true);
}
$('undo').onclick=function(){if(PEND)PEND.undo();$('toast').classList.remove('on');};
document.addEventListener('click',function(e){
  if(e.target.id==='more'){showAll=true;render();return;}
  var b=e.target.closest('button[data-id]');if(!b||b.disabled)return;var x=CUR[b.dataset.id];if(!x)return;
  if(!conn()){$('pin').style.display='block';$('pinIn').focus();return;}
  if(x.kind==='job')return finish(x,b,function(){return api({action:'done',item:x.item,row:x.row,finish:true});},true);
  if(x.kind==='done')return finish(x,b,function(){return api({action:'done',item:x.item,row:x.row});},true);
  if(x.kind==='appr')return finish(x,b,function(){return api({action:'approve',id:x.aid,status:'Approved',note:''});},true);
  if(x.kind==='text'){b.disabled=true;b.textContent='…';
    api({action:'approve',id:x.aid,status:'Approved',note:''}).then(function(){return api({action:'phone',id:x.aid});}).then(function(j){
      b.disabled=false;finish(x,b,function(){return Promise.resolve();},false);
      go('sms:'+String(j.phone).replace(/[^\d+]/g,'')+'&body='+encodeURIComponent(j.draft||''));
    }).catch(function(err){b.disabled=false;b.textContent='Send text';NOTE[x.id]='Couldn’t open the text just now. Try again in a moment.';render();});}
});
$('pinGo').onclick=function(){var v=$('pinIn').value.trim();if(v.length<4)return;saveConn({url:DEFURL,pin:v});$('pin').style.display='none';refresh();};
var busy=false;
function refresh(){var nd=ymd(new Date());if(D.day!==nd){D={day:nd,list:[]};HIDE={};saveD();}
  render();if(!conn()){$('pin').style.display='block';return Promise.resolve();}
  if(busy)return Promise.resolve();busy=true;
  var s=function(){return api({action:'state'});};
  return s().catch(function(e){if(/pin/i.test(e.message))throw e;return new Promise(function(r){setTimeout(r,2500);}).then(s);}).then(function(j){if(!j||!j.board)throw new Error('bad state');S=j;try{localStorage.setItem(LK,JSON.stringify(j));}catch(e){}
      $('st').innerHTML='<a href="classic/">Classic view</a>';})
   .catch(function(e){$('st').innerHTML=(S?'Showing your last update · ':'Can’t reach your board right now · ')+'<a href="classic/">Classic view</a>';if(/pin/i.test(e.message))$('pin').style.display='block';})
   .then(function(){busy=false;render();});}
function verCheck(){if(!/^https?:/.test(location.protocol))return;fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(v){
  if(v&&v.build&&v.build!==BUILD){var k='bermanMC.reload';if(sessionStorage.getItem(k)===v.build)return;sessionStorage.setItem(k,v.build);location.reload();}}).catch(function(){});}
render();refresh();verCheck();
document.addEventListener('visibilitychange',function(){if(!document.hidden){refresh();verCheck();}});
window.addEventListener('pageshow',function(e){if(e.persisted){busy=false;refresh();verCheck();}});
setInterval(function(){if(!document.hidden)refresh();},300000);
</script></body></html>
